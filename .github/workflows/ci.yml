name: CI

on:
  push:
    branches: [master]
  pull_request:

# Cancel superseded runs on the same branch/PR rather than letting them
# queue behind each other.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # No Supabase env vars are set in this job on purpose — the app is
      # designed to build and degrade to an honest "not configured" UI
      # without them (docs/SECURITY.md "Never a fake login"), so a build
      # that only passes with real secrets present would be masking a
      # regression, not proving anything.
      - name: Build
        run: npm run build

  e2e:
    name: e2e (backend-dependent specs)
    runs-on: ubuntu-latest
    needs: checks
    # The `secrets` context is not available in a job-level `if:` (only in
    # `steps`/`env`), so this can't gate directly on whether the three
    # backend secrets are set. Gated instead on the repository variable
    # E2E_ENABLED (Settings → Secrets and variables → Actions → Variables,
    # not Secrets — variables ARE readable from a job `if:`), which a human
    # sets to "true" once a throwaway Supabase project's credentials have
    # also been added as repository secrets: E2E_SUPABASE_URL,
    # E2E_SUPABASE_ANON_KEY, E2E_SUPABASE_SERVICE_ROLE_KEY. Backend-dependent
    # specs: e2e/auth.spec.ts, e2e/duet.spec.ts, e2e/critical-journey.spec.ts
    # — see playwright.config.ts's BACKEND_SPECS. Without E2E_ENABLED this
    # job is skipped entirely rather than run and left to fail on every
    # assertion against an unconfigured app — see docs/TESTING.md.
    if: ${{ vars.E2E_ENABLED == 'true' }}
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_SUPABASE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e specs
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
